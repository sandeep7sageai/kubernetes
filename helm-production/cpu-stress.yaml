# This pod deliberately consumes CPU in a busy loop.
apiVersion: v1
kind: Pod
metadata:
  name: cpu-stress
  namespace: helm-learning
spec:
  containers:
    - name: cpu-stress
      image: busybox:1.36
      command: ["/bin/sh", "-c"]
      args:
        - "while true; do :; done"
      resources:
        requests:
          cpu: "100m"
          memory: "32Mi"
        limits:
          cpu: "500m"
          memory: "64Mi"