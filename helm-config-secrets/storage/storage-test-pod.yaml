apiVersion: v1
kind: Pod
metadata:
  name: ebs-storage-test
  namespace: helm-learning
spec:
  containers:
    - name: test
      image: busybox:1.36

      command:
        - sh
        - -c
        - |
          echo "Pod started"
          sleep 3600

      volumeMounts:
        - name: data
          mountPath: /data

  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: ebs-learning-pvc