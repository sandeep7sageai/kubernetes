apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: storage-demo
  namespace: helm-learning

spec:
  serviceName: storage-demo
  replicas: 3

  selector:
    matchLabels:
      app: storage-demo

  template:
    metadata:
      labels:
        app: storage-demo

    spec:
      containers:
        - name: busybox
          image: busybox:1.36

          command:
            - sh
            - -c
            - |
              echo "Started $(hostname)"
              sleep 36000

          volumeMounts:
            - name: data
              mountPath: /data

  volumeClaimTemplates:
    - metadata:
        name: data

      spec:
        accessModes:
          - ReadWriteOnce

        storageClassName: gp3-csi

        resources:
          requests:
            storage: 1Gi