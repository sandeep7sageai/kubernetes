apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "my-web-app.name" . }}
  labels:
    {{- include "my-web-app.labels" . | nindent 4 }}
    environment: {{ required "environment must be specified" .Values.environment | quote }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  strategy:
    type: {{ .Values.strategy.type }}
    rollingUpdate:
      maxUnavailable: {{ .Values.strategy.rollingUpdate.maxUnavailable }}
      maxSurge: {{ .Values.strategy.rollingUpdate.maxSurge }}
  selector:
    matchLabels:
      {{- include "my-web-app.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        {{- include "my-web-app.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: app-config
          configMap:
            name: {{ include "my-web-app.name" . }}
        - name: database-secret
          secret:
            secretName: {{ include "my-web-app.name" . }}-database
      {{- if .Values.initContainer.enabled }}
      initContainers:
        - name: wait-for-service
          image: "{{ .Values.initContainer.image.repository }}:{{ .Values.initContainer.image.tag }}"

          command:
            - sh
            - -c
            - |
              echo "Waiting for {{ .Values.initContainer.dependency.host }}:{{ .Values.initContainer.dependency.port }}..."

              until wget \
                -q \
                -O /dev/null \
                http://{{ .Values.initContainer.dependency.host }}:{{ .Values.initContainer.dependency.port }}; do

                echo "Dependency not available. Retrying..."
                sleep {{ .Values.initContainer.retryInterval }}
              done

              echo "Dependency is available."
      {{- end }}
      containers:
        - name: nginx
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default "latest" }}"
          {{- with .Values.resources }}
          resources:
            requests:
              cpu: {{ .requests.cpu | quote }}
              memory: {{ .requests.memory | quote }}
            limits:
              cpu: {{ .limits.cpu | quote }}
              memory: {{ .limits.memory | quote }}
          {{- end }}
          ports:
            - containerPort: 80
          {{- if .Values.readinessProbe.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.readinessProbe.path }}
              port: 80
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
          {{- end }} 
          {{- if .Values.livenessProbe.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.livenessProbe.path }}
              port: 80
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
          {{- end }}
          {{- if .Values.startupProbe.enabled }}
          startupProbe:
            httpGet:
              path: {{ .Values.startupProbe.path }}
              port: 80
            periodSeconds: {{ .Values.startupProbe.periodSeconds }}
            failureThreshold: {{ .Values.startupProbe.failureThreshold }}
          {{- end }}
          {{- if .Values.configMap.enabled }}
          envFrom:
          - configMapRef:
              name: {{ include "my-web-app.name" . }}
          {{- end }}
          - secretRef:
              name: {{ include "my-web-app.name" . }}-database
          volumeMounts:
            - name: app-config
              mountPath: /etc/myapp
              readOnly: true
            - name: database-secret
              mountPath: /etc/secrets
              readOnly: true  