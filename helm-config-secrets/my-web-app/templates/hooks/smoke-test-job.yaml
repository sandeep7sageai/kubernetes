apiVersion: batch/v1
kind: Job

metadata:
  name: {{ include "my-web-app.name" . }}-smoke-test

  annotations:
    "helm.sh/hook": post-upgrade
    "helm.sh/hook-weight": "10"
    "helm.sh/hook-delete-policy": before-hook-creation

spec:
  backoffLimit: 1

  template:
    spec:
      restartPolicy: Never

      containers:
        - name: smoke-test
          image: curlimages/curl:8.12.1

          command:
            - sh
            - -c
            - |
              set -e
              echo "================================"
              echo "Starting application smoke test"
              echo "Release: {{ .Release.Name }}"
              echo "Revision: {{ .Release.Revision }}"
              echo "Environment: {{ .Values.environment }}"
              echo "================================"

              echo "Testing http://{{ .Release.Name }}/"

              # because your service.yaml defines:
              #   metadata:
              #     name: {{ .Release.Name }}

              curl \
                --fail \
                --silent \
                --show-error \
                http://{{ .Release.Name }}/ > /dev/null

              echo "HTTP request successful"
              echo "Smoke test PASSED"