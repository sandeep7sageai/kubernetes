apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "my-web-app.name" . }}-migration

  annotations:
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation

spec:
  backoffLimit: 1

  template:
    spec:
      restartPolicy: Never

      containers:
        - name: migration
          image: busybox:1.36

          command:
            - sh
            - -c
            - |
              echo "================================"
              echo "Starting database migration..."
              echo "Release: {{ .Release.Name }}"
              echo "Revision: {{ .Release.Revision }}"
              echo "Environment: {{ .Values.environment }}"
              echo "================================"

              sleep 5

              echo "Running schema migration..."
              sleep 5

              echo "Migration completed successfully."


              # Uncomment the following lines to simulate a migration failure
              #echo "DATABASE MIGRATION FAILED"
              #exit 1